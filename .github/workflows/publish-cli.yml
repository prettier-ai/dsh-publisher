# Pack and publish a bundled `@prettier-ai/dsh` and the thin `@prettier-ai/dshp`
# wrapper. Dispatch-only: no schedule.
#
# After the host-side `@deepseek-ai/*` compatibility layer lands, operators can
# ship a new CLI tarball without republishing the vendor/dsh families (~230
# packages). Use this when those workspace packages of the same version are
# already on the registry. The same dispatch also packs `dshp` so a CLI-only
# run can ship `@prettier-ai/dshp` when `@prettier-ai/dsh` is already present.
#
# The job still fetches the official tag, rescopes the checkout, builds, then
# `pnpm deploy`s `apps/cli` from the resolved lockfile so the published CLI
# tarball includes production `node_modules` and does not list the workspace
# packages as `dependencies` (npm must not resolve that peer graph). After
# deploy it copies nested workspace packages that `pnpm deploy --prod --legacy`
# omitted (for example `@prettier-ai/cosmokit` via cordis) into that tree as
# real directories. The runtime `@deepseek-ai/*` loader is applied to that
# bundled tree. It then packs `@prettier-ai/dshp` from this repository, uploads
# both, and `npm publish`es them when NPM_TOKEN is set. It never calls
# `release:pack --family` or `release:publish --family`.
#
# Source git tag is still the official tag from `tag` / the probe. Optional
# input `npm_version` is an operator override for a burned registry
# name@version (npm never reuses it after publish). Empty keeps the official
# probe version. When set, that exact string is the published version for the
# bundled CLI and dshp — it is not a suffix and is not auto-appended. Example:
# `tag` `dsh-v0.1.1-rc.2` + `npm_version` `0.1.1-rc.2-bundle.1` publishes
# `@prettier-ai/dsh@0.1.1-rc.2-bundle.1` and `@prettier-ai/dshp@0.1.1-rc.2-bundle.1`
# while leaving `0.1.1-rc.2` on the registry. Optional `suffix` still joins as
# `{official}-{suffix}` when `npm_version` is empty; if both are set,
# `npm_version` wins. Versions containing `-` use `npm publish --tag next` and
# do not move `latest`. Sync upstream release stays override-free. If
# `@prettier-ai/dsh@<published-version>` is already on npm with different
# contents, CLI publish fails on integrity mismatch — pass a new unpublished
# `npm_version`, wait for a new official tag, or inspect the tarball on this
# run's artifacts. `@prettier-ai/dshp` still publishes in that case when it is
# absent from npm; it does not overwrite `@prettier-ai/dsh`.
#
# Optional input `tag`: empty uses the same probe as Sync (latest stable, else
# newest non-draft including prereleases).
#
# Required secret: NPM_TOKEN (same as Sync). Missing token still packs and
# uploads the tarballs, then skips npm publish. Never commit a token.
#
# This workflow does not push the prettier-ai/<version> tracking tag.
name: Pack CLI / Publish CLI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream git tag (empty = latest stable, else newest non-draft including prereleases)'
        required: false
        type: string
      suffix:
        description: 'Optional npm prerelease suffix joined with a hyphen (e.g. bundle.1 → 0.1.1-rc.2-bundle.1). Empty = official version. Ignored when npm_version is set. Does not move latest.'
        required: false
        type: string
      npm_version:
        description: 'Optional published npm version override (e.g. 0.1.1-rc.2-bundle.1 while tag is dsh-v0.1.1-rc.2). Empty = official probe version. Does not unpublish or reuse a burned name@version. Wins over suffix when both are set. Does not move latest.'
        required: false
        type: string

permissions:
  contents: read
  # id-token: write lets npm attach provenance when the packed manifest requests it.
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  UPSTREAM_REMOTE: https://github.com/deepseek-ai/deepseek-harness.git

jobs:
  decide:
    name: Probe official release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.probe.outputs.tag }}
      version: ${{ steps.probe.outputs.version }}
      reason: ${{ steps.probe.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/probe-upstream-release.ts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Probe
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${INPUT_TAG}" ]]; then
            extra+=(--tag "${INPUT_TAG}")
          fi
          if [[ ! -f scripts/probe-upstream-release.ts ]]; then
            echo "sparse-checkout did not leave scripts/probe-upstream-release.ts on disk" >&2
            ls -la . scripts 2>/dev/null || true
            exit 1
          fi
          node --experimental-strip-types scripts/probe-upstream-release.ts --github-output "${extra[@]}"

  pack:
    name: Rescope, pack CLI, publish CLI
    needs: decide
    # Pack even when the probe would skip a full-family Sync (version already
    # on npm): the artifact is still useful, and publish-cli-tarball.ts refuses
    # to overwrite a different registry tarball. npm_version (or suffix) publishes
    # a new npm version for the same official tag without unpublishing. dshp can
    # still ship.
    if: needs.decide.outputs.tag != ''
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_TAG: ${{ needs.decide.outputs.tag }}
      VERSION: ${{ needs.decide.outputs.version }}
      DECISION: ${{ needs.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fetch the official tag
        run: |
          set -euo pipefail
          echo "probe decision: ${DECISION}"
          git clone --depth 1 --branch "${UPSTREAM_TAG}" "${UPSTREAM_REMOTE}" upstream

      - name: Copy the rescope overlay onto the official checkout
        run: |
          set -euo pipefail
          # Official tsconfig.host.json typechecks scripts/**/*.ts. Copy only
          # the rescope entry before build:official. Overlay files that keep
          # @deepseek-ai/ as data land after that typecheck.
          cp scripts/rescope-to-prettier-ai.ts \
             upstream/scripts/

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Resolve published npm version
        id: publish-version
        env:
          SUFFIX: ${{ inputs.suffix }}
          NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          set -euo pipefail
          published="$(node --experimental-strip-types scripts/bundle-cli.ts --published-version --official "${VERSION}" --suffix "${SUFFIX:-}" --npm-version "${NPM_VERSION:-}")"
          echo "version=${published}" >> "${GITHUB_OUTPUT}"
          echo "PUBLISHED_VERSION=${published}" >> "${GITHUB_ENV}"
          echo "official version: ${VERSION}"
          echo "published npm version: ${published}"

      - name: Apply the rescope to the official checkout
        working-directory: upstream
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/rescope-to-prettier-ai.ts --apply
          node --experimental-strip-types scripts/rescope-to-prettier-ai.ts --check --applied

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: upstream/package.json
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install the rescoped workspace
        working-directory: upstream
        run: pnpm install --ignore-scripts

      - name: Build official artifacts
        working-directory: upstream
        run: pnpm run build:official

      - name: Copy the remaining overlay scripts onto the official checkout
        run: |
          set -euo pipefail
          cp scripts/rescope-to-prettier-ai.spec.ts \
             scripts/probe-upstream-release.ts \
             scripts/probe-upstream-release.spec.ts \
             scripts/inject-deepseek-ai-compat.ts \
             scripts/inject-deepseek-ai-compat.spec.ts \
             scripts/publish-cli-tarball.ts \
             scripts/publish-cli-tarball.spec.ts \
             scripts/publish-dshp.ts \
             scripts/publish-dshp.spec.ts \
             scripts/bundle-cli.ts \
             scripts/bundle-cli.spec.ts \
             upstream/scripts/

      - name: Bundle @prettier-ai/dsh from the resolved lockfile
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p dist/npm-cli
          node --experimental-strip-types scripts/bundle-cli.ts --workspace . --out dist/npm-cli --version "${PUBLISHED_VERSION}"

      - name: Verify @deepseek-ai/* compatibility on the bundled CLI tarball
        working-directory: upstream
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/inject-deepseek-ai-compat.ts --check --applied --from dist/npm-cli

      - name: Pack @prettier-ai/dshp
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/publish-dshp.ts --pack --version "${PUBLISHED_VERSION}" --out dist/npm-dshp

      - uses: actions/upload-artifact@v4
        with:
          name: prettier-ai-dsh-cli-${{ steps.publish-version.outputs.version }}
          path: |
            upstream/dist/npm-cli/*
            dist/npm-dshp/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish the CLI and dshp tarballs when NPM_TOKEN is present
        working-directory: upstream
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${NPM_TOKEN}" ]]; then
            echo "NPM_TOKEN is unset: packed tarballs were uploaded as workflow artifacts; skipping npm publish."
            echo "Add a repository secret NPM_TOKEN with publish access to the prettier-ai npm org, then re-run Pack CLI / Publish CLI."
            exit 0
          fi
          export NODE_AUTH_TOKEN="${NPM_TOKEN}"
          # CLI must actually land on the registry. `if ! cmd; then status=$?`
          # is always 0 in bash because the `!` succeeded. Capture with `||`.
          # dshp may already exist at this version; skip without failing.
          cli_status=0
          node --experimental-strip-types scripts/publish-cli-tarball.ts --from dist/npm-cli || cli_status=$?
          node --experimental-strip-types "${GITHUB_WORKSPACE}/scripts/publish-dshp.ts" --from "${GITHUB_WORKSPACE}/dist/npm-dshp"
          exit "${cli_status}"
